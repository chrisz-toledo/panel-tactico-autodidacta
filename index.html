<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AEGIS v2.0 — Tutor Autónomo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--font-sans:'Inter',system-ui,-apple-system,sans-serif;--font-mono:'JetBrains Mono',monospace}
[data-theme="dark"]{
  --bg-primary:#0a0e17;--bg-secondary:#111827;--bg-card:#1a1f2e;
  --bg-chat-user:#2563eb22;--bg-chat-bot:#1e293b;
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;
  --accent-blue:#3b82f6;--accent-green:#22c55e;--accent-gold:#f59e0b;
  --accent-red:#ef4444;--accent-purple:#a855f7;--accent-cyan:#06b6d4;
  --border:#1e293b;--glass:rgba(30,41,59,0.5);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --glow-blue:0 0 20px rgba(59,130,246,0.15);
  --input-bg:#0f172a;--scrollbar:#334155;
}
[data-theme="light"]{
  --bg-primary:#f8fafc;--bg-secondary:#f1f5f9;--bg-card:#ffffff;
  --bg-chat-user:#eff6ff;--bg-chat-bot:#f1f5f9;
  --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --accent-blue:#2563eb;--accent-green:#16a34a;--accent-gold:#d97706;
  --accent-red:#dc2626;--accent-purple:#9333ea;--accent-cyan:#0891b2;
  --border:#e2e8f0;--glass:rgba(241,245,249,0.8);
  --shadow:0 4px 24px rgba(0,0,0,0.08);
  --glow-blue:0 0 20px rgba(37,99,235,0.08);
  --input-bg:#ffffff;--scrollbar:#cbd5e1;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-sans);background:var(--bg-primary);
  color:var(--text-primary);display:flex;flex-direction:column;
  transition:background .3s,color .3s;
}

/* ── MAIN LAYOUT (DASHBOARD + CHAT) ────────────── */
.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: 100%;
}

.dashboard-area {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-sidebar {
  width: 400px;
  border-left: 1px solid var(--border);
  background: var(--bg-secondary);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease;
}

.chat-sidebar.hidden {
  display: none;
}

/* ── DASHBOARD WIDGETS ─────────────────────────── */
.widget {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.widget-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-cyan);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── VECTOR GRID ───────────────────────────────── */
.vector-grid-container {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.vector-dot {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  background: var(--border);
  transition: all 0.2s;
}
.vector-dot.done {
  background: var(--accent-green);
  box-shadow: 0 0 8px rgba(34,197,94,0.4);
}
.vector-dot.current {
  background: var(--accent-cyan);
  box-shadow: 0 0 10px rgba(6,182,212,0.6);
  animation: pulseDot 1.5s infinite;
}
@keyframes pulseDot {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.8; }
  100% { transform: scale(1); opacity: 1; }
}

/* ── HEADER ────────────────────────────────────── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--bg-secondary);
  border-bottom:1px solid var(--border);flex-shrink:0;
  backdrop-filter:blur(12px);z-index:10;
}
.header-left{display:flex;align-items:center;gap:12px}
.logo{
  font-size:18px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo-sub{font-size:11px;color:var(--text-muted);font-weight:500}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;
  background:var(--glass);border:1px solid var(--border);
}
.badge-xp{color:var(--accent-gold)}
.badge-streak{color:var(--accent-green)}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  background:none;border:1px solid var(--border);border-radius:8px;
  color:var(--text-secondary);cursor:pointer;padding:6px 8px;font-size:16px;
  transition:all .2s;
}
.icon-btn:hover{background:var(--glass);color:var(--text-primary);transform:scale(1.05)}

/* ── CHAT AREA ─────────────────────────────────── */
.chat-container{
  flex:1;display:flex;flex-direction:column;
  max-width:800px;width:100%;margin:0 auto;
  overflow:hidden;
}
.chat-messages{
  flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:6px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}

/* ── MESSAGE BUBBLES ───────────────────────────── */
.msg{display:flex;gap:10px;max-width:92%;animation:msgIn .35s ease}
.msg-bot{align-self:flex-start}
.msg-user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--glass);border:1px solid var(--border);
}
.msg-user .msg-avatar{background:var(--accent-blue);border-color:var(--accent-blue);font-size:14px;color:#fff}
.msg-bubble{
  padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;
  position:relative;word-wrap:break-word;
}
.msg-bot .msg-bubble{
  background:var(--bg-chat-bot);border:1px solid var(--border);
  border-top-left-radius:4px;
}
.msg-user .msg-bubble{
  background:var(--accent-blue);color:#fff;
  border-top-right-radius:4px;border:none;
}
.msg-bubble a{color:var(--accent-cyan);text-decoration:none;font-weight:600}
.msg-bubble a:hover{text-decoration:underline}
.msg-time{font-size:10px;color:var(--text-muted);margin-top:4px}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── SPECIAL CARDS (inside bubbles) ────────────── */
.card-inline{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-top:10px;
}
.card-inline h4{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--accent-cyan)}
.card-inline p{font-size:12px;color:var(--text-secondary);line-height:1.5}
.task-badge{
  display:inline-block;padding:3px 8px;border-radius:6px;
  font-size:11px;font-weight:600;margin-right:6px;margin-bottom:4px;
}
.task-theory{background:rgba(59,130,246,0.15);color:var(--accent-blue)}
.task-practice{background:rgba(34,197,94,0.15);color:var(--accent-green)}
.task-project{background:rgba(245,158,11,0.15);color:var(--accent-gold)}
.task-review{background:rgba(168,85,247,0.15);color:var(--accent-purple)}
.task-rest{background:rgba(100,116,139,0.15);color:var(--text-muted)}

/* ── POMODORO INLINE ───────────────────────────── */
.pomo-inline{
  display:flex;align-items:center;gap:16px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:16px;margin-top:10px;
}
.pomo-ring{position:relative;width:72px;height:72px;flex-shrink:0}
.pomo-ring svg{transform:rotate(-90deg);width:72px;height:72px}
.pomo-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.pomo-ring .track{stroke:var(--border)}
.pomo-ring .fill{stroke:var(--accent-blue);transition:stroke-dashoffset 1s linear}
.pomo-time{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--font-mono);font-size:16px;font-weight:700;
}
.pomo-info{flex:1}
.pomo-label{font-size:13px;font-weight:700;margin-bottom:2px}
.pomo-sub{font-size:11px;color:var(--text-secondary)}
.pomo-controls{display:flex;gap:6px;margin-top:8px}

/* ── BUTTONS ───────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;
  border:none;cursor:pointer;transition:all .2s;font-family:var(--font-sans);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--accent-blue);color:#fff}
.btn-primary:hover{background:#2563eb;box-shadow:var(--glow-blue)}
.btn-success{background:var(--accent-green);color:#fff}
.btn-success:hover{background:#16a34a}
.btn-secondary{background:var(--glass);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-card)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-lg{padding:12px 24px;font-size:15px;border-radius:12px}

/* ── QUICK ACTIONS ─────────────────────────────── */
.quick-actions{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;
}
.quick-btn{
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;
  background:var(--glass);border:1px solid var(--border);
  color:var(--text-secondary);cursor:pointer;transition:all .2s;
}
.quick-btn:hover{color:var(--accent-cyan);border-color:var(--accent-cyan);background:rgba(6,182,212,0.08)}

/* ── INPUT BAR ─────────────────────────────────── */
.chat-input-bar{
  padding:12px 16px;background:var(--bg-secondary);
  border-top:1px solid var(--border);flex-shrink:0;
}
.chat-input-wrap{
  display:flex;gap:8px;max-width:800px;margin:0 auto;
}
.chat-input{
  flex:1;padding:12px 16px;border-radius:12px;font-size:14px;
  background:var(--input-bg);border:1px solid var(--border);
  color:var(--text-primary);font-family:var(--font-sans);
  outline:none;transition:border-color .2s;
}
.chat-input:focus{border-color:var(--accent-blue)}
.chat-input::placeholder{color:var(--text-muted)}
.send-btn{
  width:44px;height:44px;border-radius:12px;border:none;
  background:var(--accent-blue);color:#fff;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.send-btn:hover{background:#2563eb;transform:scale(1.05)}

/* ── TOAST ─────────────────────────────────────── */
.toast-container{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;
  color:#fff;animation:toastIn .3s ease;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.toast-success{background:var(--accent-green)}
.toast-info{background:var(--accent-blue)}
.toast-error{background:var(--accent-red)}
.toast-gold{background:linear-gradient(135deg,#f59e0b,#d97706)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ── RESPONSIVE ────────────────────────────────── */
@media(max-width:600px){
  .header{padding:10px 14px}
  .logo{font-size:15px}
  .badge{font-size:11px;padding:3px 8px}
  .chat-messages{padding:14px 10px}
  .msg{max-width:96%}
  .msg-bubble{padding:10px 14px;font-size:13px}
  .pomo-inline{flex-direction:column;text-align:center}
  .quick-actions{justify-content:center}
}

@keyframes msgFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg { animation: msgFadeIn 0.3s ease-out forwards; }

@keyframes typing {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.typing-dot {
  display: inline-block; width: 6px; height: 6px; background: var(--text-muted);
  border-radius: 50%; margin: 0 2px;
}
.typing-dot:nth-child(1) { animation: typing 1s infinite 0s; }
.typing-dot:nth-child(2) { animation: typing 1s infinite 0.2s; }
.typing-dot:nth-child(3) { animation: typing 1s infinite 0.4s; }

@keyframes badgeBounce {
  0% { transform: scale(0.5); filter: brightness(1); }
  50% { transform: scale(1.1); filter: brightness(1.5); }
  100% { transform: scale(1); filter: brightness(1); }
}
.badge-anim { animation: badgeBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; color: gold; display:inline-block; }

@keyframes pulseBtn {
  0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(6, 182, 212, 0); }
  100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
}
.btn-primary { animation: pulseBtn 2s infinite; }

</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <div>
      <div class="logo">AEGIS</div>
      <div class="logo-sub">v2.0 — Tutor Autónomo</div>
    </div>
    <span class="badge badge-xp" id="badge-xp">⚡ 0 XP</span>
    <span class="badge badge-streak" id="badge-streak">🔥 0 días</span>
    <span class="badge badge-rank" id="badge-rank" style="color:var(--accent-purple);">🔰 Iniciado</span>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleChat()" title="Chat AI">💬</button>
    <button class="icon-btn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
    <button class="icon-btn" onclick="exportData()" title="Exportar datos">📤</button>
  </div>
</header>

<div class="main-layout">
  <!-- DASHBOARD AREA -->
  <div class="dashboard-area" id="dashboard">
    <div class="widget">
      <div class="widget-title">🌐 Vector Grid (Fases 0-7) <span id="dashPhaseInfo"></span></div>
      <div class="vector-grid-container" id="vectorGrid"></div>
    </div>
    
    <div style="display:flex; gap:20px;">
      <div class="widget" style="flex:1;">
        <div class="widget-title">📋 Misión Actual</div>
        <div id="dashTodayTask"></div>
        <div class="widget-title" style="margin-top:20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top:10px;">🏅 Logros Tácticos</div>
        <div id="dashTrophies" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>
      </div>
      <div class="widget" style="width:300px; text-align:center;">
        <div class="widget-title">⏱️ Reloj Táctico</div>
        <div id="dashPomodoro">
          <div class="pomo-ring" style="width:120px; height:120px; margin:0 auto;">
            <svg><circle class="track" cx="60" cy="60" r="54"></circle><circle class="fill" cx="60" cy="60" r="54" id="dashPomoFill" stroke-dasharray="339.29" stroke-dashoffset="0"></circle></svg>
            <div class="pomo-time" id="dashPomoTime" style="font-size:24px;">25:00</div>
          </div>
          <p id="dashPomoState" style="margin-top:10px; font-weight:bold; color:var(--text-secondary);">ESPERANDO INICIO</p>
          <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <button class="btn btn-primary" onclick="processInput('iniciar')" id="dashBtnStart">▶ Iniciar</button>
            <button class="btn btn-secondary" onclick="processInput('detener')">⏹ Detener</button>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTROL TÁCTICO WIDGET -->
    <div class="widget" style="margin-top: 20px;">
      <div class="widget-title">⚙️ Control Táctico</div>
      <div style="display:flex; flex-wrap:wrap; gap:10px;">
        <button class="btn btn-secondary" onclick="dashShowProgress()">📊 Mi Progreso</button>
        <button class="btn btn-secondary" onclick="dashShowPhases()">🗺️ Mapa de Fases</button>
        <button class="btn btn-secondary" onclick="toggleChat()">💬 Chat</button>
        <button class="btn btn-secondary" style="background:var(--accent-red); color:white;" onclick="dashHardReset()">🛑 Reset Total</button>
      </div>
    </div>
  </div>

  <!-- CHAT SIDEBAR -->
  <div class="chat-sidebar hidden" id="chatSidebar">
    <div class="chat-container">
      <div class="chat-messages" id="chat"></div>
    </div>

    <!-- INPUT BAR -->
    <div class="chat-input-bar">
      <div class="chat-input-wrap">
        <input type="text" class="chat-input" id="user-input" placeholder="Escribe un mensaje o comando..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()" title="Enviar">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ══════════════════════════════════════════════════════════
// AEGIS v2.0 — DATA LAYER
// ══════════════════════════════════════════════════════════

const DEFAULT_STATE = {
  xp:0, streak:0, max_streak:0, total_days:0, total_minutes:0,
  sessions:[], last_study_date:null, energy:3,
  pomodoros_today:0, pomodoro_minutes_today:0,
  current_phase:0, achievements:[], conceptMastery:{},
  fatigueRisk:0, motivationLevel:0.5, consecutive_bad_sessions:0,
  chatHistory:[], userName:null, soundEnabled:true,
  start_date:null, xp_cap:50000
};

let STATE = JSON.parse(localStorage.getItem('aegis_v2_state')||'null')||{...DEFAULT_STATE};

function save(){
  if(STATE.chatHistory && STATE.chatHistory.length > 50) STATE.chatHistory = STATE.chatHistory.slice(-50);
  localStorage.setItem('aegis_v2_state',JSON.stringify(STATE));
}

function getStartDate() {
  if (STATE && STATE.start_date) return STATE.start_date;
  const today = new Date().toISOString().split('T')[0];
  STATE.start_date = today;
  save();
  return today;
}

// ── CURRICULUM: 8 phases, 10 years ──────────────────────
const PHASES = [
  {id:0,name:"Fundamentos Absolutos y Setup Táctico",weeks:12,
   courses:["CS50x 2026","CS50P — Python","Arch Linux","Prompt Engineering"],

   daily:{theory:"Estudia capítulo",practice:"Implementa código",project:"Feature semanal",review:"Code review",rest:"Descansa"}},
  {id:2,name:"Estructuras de Datos y Algoritmos",weeks:20,
   courses:["OSSU Algorithms","Nand2Tetris 2","MIT 18.06","LeetCode"],
   projects:["10 Data Structures","Compilador","Visualizador","Discord Bot"],
   resources:["https://github.com/ossu/computer-science"],
   daily:{theory:"Algoritmo del día",practice:"3 LeetCode",project:"Implementa",review:"Análisis O(n)",rest:"Descansa"}},
  {id:3,name:"Ciberseguridad Básica",weeks:20,
   courses:["Bandit","TryHackMe Pre","OWASP Top 10","PortSwigger"],
   projects:["Bandit Completo","Pre-Security","SQL Injection","Port Scanner"],
   resources:["https://overthewire.org/wargames/bandit/","https://tryhackme.com/"],
   daily:{theory:"Vuln del día",practice:"Labs",project:"Herramienta",review:"Writeups",rest:"Descansa"}},
  {id:4,name:"Ciberseguridad Avanzada",weeks:24,
   courses:["TryHackMe SOC","HTB Starting","CS50 Cyber","NIST"],
   projects:["SOC Path","10 HTB","IDS System","Security Audit"],
   resources:["https://tryhackme.com/","https://www.hackthebox.com/"],
   daily:{theory:"Defensa y Forense",practice:"HTB/TryHackMe",project:"Seguridad",review:"Hallazgos",rest:"Descansa"}},
  {id:5,name:"IA & Machine Learning",weeks:28,
   courses:["fast.ai","Stanford CS229","HuggingFace NLP","Made With ML"],
   projects:["Image Classifier","RAG Chatbot","LLM Fine-tune","LangChain Agent"],
   resources:["https://www.fast.ai/","https://huggingface.co/learn/nlp-course/"],
   daily:{theory:"Lectures y papers",practice:"Jupyter Notebooks",project:"Entrena modelo",review:"Resultados",rest:"Descansa"}},
  {id:6,name:"Especialización y Open Source",weeks:32,
   courses:["Advanced ML","Bug Bounty","Open Source","System Design"],
   projects:["3 Repos OS","5 Vulnerabilidades","Librería Pública","Blog Técnico"],
   resources:["https://www.deeplearning.ai/","https://opensource.guide/"],
   daily:{theory:"Papers y docs",practice:"PoC","Contribuye OS",review:"Peer review",rest:"Descansa"}},
  {id:7,name:"Maestría y Liderazgo",weeks:36,
   courses:["arXiv Papers","Mentoría","Publicación","Portfolio Final"],
   projects:["Curso Online","Investigación","Mentor 3 personas","Portfolio Elite"],
   resources:["https://arxiv.org/list/cs/recent","https://www.coursera.org/teach"],
   daily:{theory:"Últimos papers",practice:"Experimenta",project:"Contenido educativo",review:"Mentees",rest:"Estrategia"}}
];

// ── AUDIO ENGINE ────────────────────────────────────────
const AudioEngine = {
  enabled: true,
  playStart: function() {
    if (!this.enabled) return;
    this.beep(440, 100);
  },
  playEnd: function() {
    if (!this.enabled) return;
    this.beep(880, 200);
  },
  playAchievement: function() {
    if (!this.enabled) return;
    this.beep(523, 150);
    setTimeout(() => this.beep(659, 150), 150);
  },
  beep: function(freq, duration) {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.frequency.value = freq;
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration / 1000);
    } catch (e) {
      console.log("Audio not available");
    }
  }
};

</script>

<script>
// ══════════════════════════════════════════════════════════
// AEGIS v2.0 — CORE ENGINE
// ══════════════════════════════════════════════════════════

function getTodayTask(){
  const start = new Date(getStartDate());
  const today = new Date();
  today.setHours(0,0,0,0);
  start.setHours(0,0,0,0);
  const diffDays = Math.floor((today - start) / 86400000);
  
  if(diffDays < 0) return {
    phase:PHASES[0], week:0, dayOfWeek:today.getDay(), dayNum:0, type:'rest',
    title:'El plan aún no comienza',
    detail:'Tu fecha de inicio es el '+getStartDate()+'. ¡Prepárate!',
    course:'', resources:[]
  };

  // Calculate phase and week
  let totalWeeks = Math.floor(diffDays / 7);
  let phase = PHASES[0], weekInPhase = 0, accumulated = 0;
  
  for(const p of PHASES){
    if(totalWeeks < accumulated + p.weeks){
      phase = p;
      weekInPhase = totalWeeks - accumulated;
      break;
    }
    accumulated += p.weeks;
  }
  
  if(phase.id === 7 && totalWeeks > accumulated) {
    weekInPhase = totalWeeks - accumulated;
  }

  const dow = today.getDay();
  const courseIdx = weekInPhase % phase.courses.length;
  const projectIdx = Math.floor(weekInPhase / 4) % phase.projects.length;
  const course = phase.courses[courseIdx];
  const project = phase.projects[projectIdx];

  // Day type based on day of week
  let type, typeBadge, typeLabel, detail;
  switch(dow){
    case 1: case 3:
      type='theory'; typeBadge='task-theory'; typeLabel='📘 Teoría';
      detail=phase.daily.theory;
      break;
    case 2: case 4:
      type='practice'; typeBadge='task-practice'; typeLabel='💪 Práctica';
      detail=phase.daily.practice;
      break;
    case 5:
      type='project'; typeBadge='task-project'; typeLabel='🔨 Proyecto';
      detail=phase.daily.project + ' — ' + project;
      break;
    case 6:
      type='review'; typeBadge='task-review'; typeLabel='🔄 Repaso';
      detail=phase.daily.review;
      break;
    default:
      type='rest'; typeBadge='task-rest'; typeLabel='🌿 Descanso';
      detail=phase.daily.rest;
  }
  
  const dayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  
  return {
    phase, week:weekInPhase+1, dayOfWeek:dow, dayNum:diffDays+1,
    type, typeBadge, typeLabel,
    title:`Fase ${phase.id}: ${phase.name} — Semana ${weekInPhase+1}`,
    detail, course, project,
    resources:phase.resources||[]
  };
}

// ── CALIBRATION ENGINE ──────────────────────────────────
const CalibrationEngine = {
  processSession: function(sessionData) {
    const { concept, score, effortRating } = sessionData;
    
    if (!STATE.conceptMastery) STATE.conceptMastery = {};
    const currentMastery = STATE.conceptMastery[concept] || 0.1;
    const expectedScore = currentMastery * 10;
    const actualScore = score;
    const kFactor = 0.15;
    
    const newMastery = Math.min(1.0, Math.max(0.0, currentMastery + kFactor * (actualScore - expectedScore) / 10));
    STATE.conceptMastery[concept] = newMastery;
    
    if (score < 5 && effortRating > 3) {
      STATE.consecutive_bad_sessions = (STATE.consecutive_bad_sessions || 0) + 1;
    } else {
      STATE.consecutive_bad_sessions = 0;
    }
    STATE.fatigueRisk = Math.min(1.0, ((STATE.consecutive_bad_sessions||0) * 0.3));
    
    STATE.motivationLevel = STATE.motivationLevel || 0.5;
    if (score > 8) STATE.motivationLevel = Math.min(1.0, STATE.motivationLevel + 0.1);
    else if (effortRating < 3) STATE.motivationLevel = Math.max(0.0, STATE.motivationLevel - 0.1);
    
    return {
      mastery: newMastery,
      fatigue: STATE.fatigueRisk,
      motivation: STATE.motivationLevel
    };
  }
};

// ── PSYCHOLOGY ENGINE ───────────────────────────────────
const PsychologyEngine = {
  generateFeedback: function(sessionScore, effortRating, fatigueRisk) {
    let message = "";
    if (sessionScore >= 8) {
      message = "¡Rendimiento sobresaliente! Estás dominando este tema.";
    } else if (sessionScore >= 5) {
      message = "Buen progreso. El aprendizaje constante construye la maestría.";
    } else {
      message = "Sesión desafiante. Analiza en qué fallaste.";
    }
    
    if (fatigueRisk > 0.6) {
      message += " Considera tomar un descanso más largo.";
    }
    
    let badge = null;
    if (effortRating === 5 && sessionScore > 7 && !STATE.achievements.includes("Mente de Acero")) {
      badge = "Mente de Acero";
      STATE.achievements.push(badge);
    }
    
    const today = new Date().toISOString().split('T')[0];
    const sessionsToday = STATE.sessions.filter(s => s.date === today).length;
    if (sessionsToday >= 3 && !STATE.achievements.includes("Maratonista")) {
      badge = badge ? badge + ", Maratonista" : "Maratonista";
      STATE.achievements.push("Maratonista");
    }
    
    return { message, badge };
  }
};

// ── POMODORO ────────────────────────────────────────────
let pomoTimer=null, pomoSec=1500, pomoTotal=1500, pomoRunning=false;
const CIRCUMFERENCE = 2 * Math.PI * 30;

function startPomodoro(duration){
  if(pomoRunning) return;
  
  if((STATE.fatigueRisk || 0) >= 0.8 && (!duration || duration >= 25)) {
    addBotMsg('🛑 <strong>STOP-LOSS ACTIVADO</strong><br>Tu riesgo de fatiga es del ' + (STATE.fatigueRisk*100).toFixed(0) + '%.');
    showToast('Bloqueo por Fatiga', 'error');
    return;
  }

  pomoSec = (duration||25)*60;
  pomoTotal = pomoSec;
  pomoRunning = true;
  AudioEngine.playStart();
  addBotMsg('⏱️ Pomodoro iniciado — ' + Math.round(pomoTotal/60) + ' minutos. ¡A trabajar!');

  pomoTimer = setInterval(()=>{
    pomoSec--;
    updatePomoDisplay();
    if(pomoSec <= 0){
      clearInterval(pomoTimer);
      pomoRunning = false;
      completePomodoro();
    }
  }, 1000);
}

function updatePomoDisplay(){
  const m = String(Math.floor(pomoSec/60)).padStart(2,'0');
  const s = String(pomoSec%60).padStart(2,'0');
  const el = document.getElementById('dashPomoTime');
  if(el) el.textContent = m+':'+s;
  const fill = document.getElementById('dashPomoFill');
  if(fill) fill.style.strokeDashoffset = CIRCUMFERENCE * (1 - pomoSec/pomoTotal);
}

function pausePomodoro(){
  if(!pomoRunning) return;
  clearInterval(pomoTimer);
  pomoRunning = false;
  addBotMsg('⏸ Pomodoro pausado. Escribe <strong>continuar</strong> para reanudar.');
}

function resumePomodoro(){
  if(pomoRunning || pomoSec <= 0) return;
  pomoRunning = true;
  pomoTimer = setInterval(()=>{
    pomoSec--;
    updatePomoDisplay();
    if(pomoSec <= 0){
      clearInterval(pomoTimer);
      pomoRunning = false;
      completePomodoro();
    }
  }, 1000);
  addBotMsg('▶️ Pomodoro reanudado.');
}

function stopPomodoro(){
  clearInterval(pomoTimer);
  pomoRunning = false;
  const elapsed = Math.round((pomoTotal - pomoSec) / 60);
  addBotMsg('⏹ Pomodoro detenido. Estudiaste <strong>'+elapsed+' minutos</strong>.');
  if(elapsed >= 5) recordSession(elapsed, 60);
  pomoSec = 0;
}

function completePomodoro(){
  const mins = Math.round(pomoTotal / 60);
  STATE.pomodoros_today = (STATE.pomodoros_today||0) + 1;
  STATE.pomodoro_minutes_today = (STATE.pomodoro_minutes_today||0) + mins;
  STATE.last_session_mins = mins;
  AudioEngine.playEnd();
  
  showToast('🍅 ¡Pomodoro completado!','success');
  addBotMsg(`🍅 <strong>¡Pomodoro completado!</strong><br><br>¿Cómo te sentiste (esfuerzo)? (1-5)`);
  STATE.awaitingInput = 'effort_rating';
}

function recordSession(minutes, score){
  const today = new Date().toISOString().split('T')[0];
  STATE.sessions.push({date:today, minutes, score, energy:STATE.energy||3});
  STATE.total_minutes += minutes;
  STATE.total_days = new Set(STATE.sessions.map(s=>s.date)).size;

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate()-1);
  const yStr = yesterday.toISOString().split('T')[0];
  
  if(STATE.last_study_date === yStr || STATE.last_study_date === today){
    if(STATE.last_study_date !== today) STATE.streak++;
  } else if(STATE.last_study_date !== today) {
    STATE.streak = 1;
  }
  
  if(STATE.streak > STATE.max_streak) STATE.max_streak = STATE.streak;
  STATE.last_study_date = today;

  // XP con cap
  const baseXP = Math.round(score*0.5 + minutes*0.3) + 25;
  const streakMultiplier = Math.min(1 + (STATE.streak * 0.05), 2.5);
  const isCrit = Math.random() > 0.85;
  
  let finalXP = Math.round(baseXP * streakMultiplier);
  if(isCrit) finalXP = Math.round(finalXP * 1.5);
  
  STATE.xp = Math.min(STATE.xp + finalXP, STATE.xp_cap || 50000);
  
  save();
  updateUI();
}

</script>

<script>
// ══════════════════��═══════════════════════════════════════
// AEGIS v2.0 — UI & CHAT FUNCTIONS
// ══════════════════════════════════════════════════════════

function processInput(cmd){
  const input = (cmd || document.getElementById('user-input').value || '').trim().toLowerCase();
  if(!input) return;
  
  if(document.getElementById('user-input')) document.getElementById('user-input').value = '';
  
  addUserMsg(input);
  
  if(STATE.awaitingInput === 'effort_rating'){
    const n = parseInt(input);
    if(n >= 1 && n <= 5){
      STATE.last_effort = n;
      STATE.last_score = (n * 2) + (Math.random() * 20);
      addBotMsg(`Esfuerzo registrado: ${n}/5. Score: ${STATE.last_score.toFixed(1)}/10`);
      finishSessionProcess();
      STATE.awaitingInput = null;
    }
    return;
  }
  
  // Commands
  if(input === 'iniciar' || input === 'start') startPomodoro();
  else if(input === 'pausar' || input === 'pause') pausePomodoro();
  else if(input === 'continuar' || input === 'resume') resumePomodoro();
  else if(input === 'detener' || input === 'stop') stopPomodoro();
  else if(input === 'ayuda') dashShowHelp();
  else if(input === 'progreso') dashShowProgress();
  else addBotMsg('Comando no reconocido. Intenta: iniciar, pausar, continuar, detener, ayuda, progreso');
}

function sendMessage(){
  processInput();
}

function addUserMsg(text){
  const chat = document.getElementById('chat');
  if(!chat) return;
  
  const msg = document.createElement('div');
  msg.className = 'msg msg-user';
  msg.innerHTML = `
    <div class="msg-avatar">👤</div>
    <div>
      <div class="msg-bubble">${escapeHtml(text)}</div>
      <div class="msg-time">${new Date().toLocaleTimeString()}</div>
    </div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function addBotMsg(html){
  const chat = document.getElementById('chat');
  if(!chat) return;
  
  const msg = document.createElement('div');
  msg.className = 'msg msg-bot';
  msg.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div>
      <div class="msg-bubble">${html}</div>
      <div class="msg-time">${new Date().toLocaleTimeString()}</div>
    </div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(message, type){
  const container = document.getElementById('toast-container');
  if(!container) return;
  
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  toast.textContent = message;
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.remove();
  }, 3000);
}

function toggleChat(){
  const sidebar = document.getElementById('chatSidebar');
  if(sidebar) sidebar.classList.toggle('hidden');
}

function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('aegis_theme', next);
}

function exportData(){
  const dataStr = JSON.stringify(STATE, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aegis-data-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  showToast('📤 Datos exportados', 'success');
}

function dashShowProgress(){
  const task = getTodayTask();
  addBotMsg(`
📊 <strong>Tu Progreso</strong>
<div class="card-inline">
  <p>⚡ XP: ${STATE.xp} / ${STATE.xp_cap || 50000}</p>
  <p>🔥 Racha: ${STATE.streak} días (máximo: ${STATE.max_streak})</p>
  <p>📅 Días totales: ${STATE.total_days}</p>
  <p>⏱️ Minutos totales: ${STATE.total_minutes}</p>
  <p>🎓 Fase actual: ${task.phase.id} - ${task.phase.name}</p>
  <p>📈 Mastería cognitiva: ${((STATE.conceptMastery[task.course] || 0) * 100).toFixed(1)}%</p>
  <p>⚠️ Riesgo de fatiga: ${(STATE.fatigueRisk * 100).toFixed(1)}%</p>
  <p>💪 Motivación: ${(STATE.motivationLevel * 100).toFixed(1)}%</p>
</div>
  `);
}

function dashShowPhases(){
  let html = '<strong>🗺️ Mapa de 8 Fases (10 años)</strong><div class="card-inline" style="margin-top:10px;">';
  PHASES.forEach((p, i) => {
    html += `<p><span class="task-badge task-${i % 5 === 0 ? 'theory' : i % 5 === 1 ? 'practice' : i % 5 === 2 ? 'project' : i % 5 === 3 ? 'review' : 'rest'}">Fase ${p.id}</span> <strong>${p.name}</strong> (${p.weeks} semanas)</p>`;
  });
  html += '</div>';
  addBotMsg(html);
}

function dashShowHelp(){
  addBotMsg(`
<strong>❓ Comandos Disponibles</strong>
<div class="card-inline" style="margin-top:10px;">
  <p><strong>iniciar / start</strong> — Inicia un Pomodoro de 25 min</p>
  <p><strong>pausar / pause</strong> — Pausa el Pomodoro</p>
  <p><strong>continuar / resume</strong> — Reanuda el Pomodoro</p>
  <p><strong>detener / stop</strong> — Detiene el Pomodoro</p>
  <p><strong>progreso</strong> — Muestra tu progreso</p>
  <p><strong>ayuda</strong> — Muestra este menú</p>
</div>
  `);
}

function dashHardReset(){
  if(confirm('⚠️ ¿Realmente quieres reiniciar TODO a Día 1?')){
    STATE = {...DEFAULT_STATE};
    STATE.start_date = new Date().toISOString().split('T')[0];
    save();
    updateUI();
    addBotMsg('🔄 Todo ha sido reiniciado.');
    showToast('Reset completo', 'success');
  }
}

function finishSessionProcess() {
  const task = getTodayTask();
  const concept = task.course || 'General';
  
  const calibResult = CalibrationEngine.processSession({
    concept: concept,
    score: STATE.last_score,
    timeTaken: STATE.last_session_mins,
    effortRating: STATE.last_effort
  });
  
  const psychResult = PsychologyEngine.generateFeedback(STATE.last_score, STATE.last_effort, calibResult.fatigue);
  
  recordSession(STATE.last_session_mins, STATE.last_score * 10);
  
  addBotMsg(`📊 <strong>Análisis de Sesión</strong>
<div class="card-inline">
  <p>Dominio en <strong>${concept}</strong>: ${(calibResult.mastery*100).toFixed(1)}%</p>
  <p>🧠 ${psychResult.message}</p>
  ${psychResult.badge ? '<p>🏅 Logro: ' + psychResult.badge + '</p>' : ''}
</div>
  `);
  
  save();
}

function updateUI(){
  // Update badges
  const xpEl = document.getElementById('badge-xp');
  if(xpEl) xpEl.textContent = '⚡ ' + STATE.xp + ' XP';
  
  const streakEl = document.getElementById('badge-streak');
  if(streakEl) streakEl.textContent = '🔥 ' + STATE.streak + ' días';
  
  // Update task
  const task = getTodayTask();
  const taskEl = document.getElementById('dashTodayTask');
  if(taskEl){
    taskEl.innerHTML = `
      <div style="margin-bottom:10px;">
        <span class="task-badge ${task.typeBadge}">${task.typeLabel}</span>
        <strong>${task.title}</strong>
      </div>
      <p style="font-size:12px; color:var(--text-secondary);">${task.detail}</p>
    `;
  }
  
  // Update achievements
  const trophiesEl = document.getElementById('dashTrophies');
  if(trophiesEl){
    trophiesEl.innerHTML = STATE.achievements.length > 0 
      ? STATE.achievements.map(a => `<span class="badge" style="background:var(--accent-gold);">${a}</span>`).join('')
      : '<p style="color:var(--text-muted);">Sin logros aún</p>';
  }
  
  // Vector grid
  const gridEl = document.getElementById('vectorGrid');
  if(gridEl && PHASES[0]){
    let html = '';
    PHASES.forEach((phase, idx) => {
      for(let i = 0; i < Math.min(phase.weeks, 10); i++){
        const isDone = task.dayNum > ((idx * 12 + i) * 7);
        const isCurrent = Math.abs(task.dayNum - ((idx * 12 + i) * 7)) < 7;
        html += `<div class="vector-dot ${isDone ? 'done' : isCurrent ? 'current' : ''}" title="Fase ${idx} Semana ${i+1}"></div>`;
      }
    });
    gridEl.innerHTML = html;
  }
}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  updateUI();
  const savedTheme = localStorage.getItem('aegis_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  
  const chatInput = document.getElementById('user-input');
  if(chatInput){
    chatInput.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') sendMessage();
    });
  }
  
  addBotMsg('👋 ¡Bienvenido a AEGIS v2.0! Escribe <strong>iniciar</strong> para comenzar un Pomodoro o <strong>ayuda</strong> para ver comandos.');
});

</script>
